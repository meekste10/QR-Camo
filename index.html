<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Camo Lab</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <h1>QR Camo Lab</h1>
    <p class="subtitle">Curves belong to the silhouette edge, not the decoding core.</p>
    <p id="debugPanel" style="background:#111;color:#00ff88;padding:8px 10px;font-size:12px;border:1px solid #333;">
      debug: html loaded
    </p>
  </header>

  <main class="app">
    <aside class="controls">
      <h2>Controls</h2>

      <label>Upload QR</label>
      <input type="file" id="qrUpload" accept="image/*">

      <label>Mask Source</label>
      <select id="maskModeSelect">
        <option value="preset">Preset Mask</option>
        <option value="custom">Custom Upload</option>
      </select>

      <div id="presetMaskSection">
        <label>Mask Shape</label>
        <select id="maskSelect">
          <option value="heart">heart</option>
          <option value="house">house</option>
          <option value="tag">tag</option>
          <option value="star">star</option>
          <option value="pizza">pizza</option>
          <option value="mug">mug</option>
          <option value="tree">tree</option>
          <option value="turtle">turtle</option>
        </select>
      </div>

      <div id="customMaskSection" style="display:none;">
        <label>Upload Custom Mask Source</label>
        <input type="file" id="customMaskUpload" accept="image/*">

        <label>Mask Threshold</label>
        <input type="range" id="customMaskThreshold" min="0" max="255" value="180">

        <label>
          <input type="checkbox" id="customMaskInvert">
          Invert Mask
        </label>

        <button id="buildMaskBtn" type="button">Build Custom Mask</button>
      </div>

      <hr>

      <label>Center QR Size</label>
      <select id="qrSizeSelect">
        <option value="small">Small</option>
        <option value="medium" selected>Medium</option>
        <option value="large">Large</option>
      </select>

      <label>Center QR X Offset</label>
      <input type="range" id="qrOffsetX" min="-200" max="200" value="0">
      <div id="qrOffsetXLabel">0</div>

      <label>Center QR Y Offset</label>
      <input type="range" id="qrOffsetY" min="-200" max="200" value="0">
      <div id="qrOffsetYLabel">0</div>

      <hr>

      <label>Foreground Color</label>
      <input type="color" id="foregroundColor" value="#000000">

      <label>Background Color</label>
      <input type="color" id="backgroundColor" value="#ffffff">

      <label>
        <input type="checkbox" id="transparentBackground">
        Transparent Background
      </label>

      <button id="generateBtn" type="button">Generate</button>
      <button id="exportBtn" type="button">Export PNG</button>
    </aside>

    <section class="previews">
      <div class="preview">
        <h3>Original QR</h3>
        <canvas id="originalCanvas"></canvas>
      </div>

      <div class="preview">
        <h3>Threshold QR</h3>
        <canvas id="thresholdCanvas"></canvas>
      </div>

      <div class="preview">
        <h3>Inner Tile Source</h3>
        <canvas id="cropCanvas"></canvas>
      </div>

      <div class="preview">
        <h3>Custom Mask Preview</h3>
        <canvas id="customMaskCanvas"></canvas>
      </div>

      <div class="preview" style="grid-column: span 2;">
        <h3>QR Camo Output</h3>
        <canvas id="outputCanvas"></canvas>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
