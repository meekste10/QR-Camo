<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Camo Lab</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="page-header">
    <h1>QR Camo Lab</h1>
    <p class="subtitle">Stable engine workbench</p>
    <div id="debugPanel" class="debug-pill">Ready.</div>
  </header>

  <main class="app-shell">
    <aside class="controls">
      <section class="card">
        <h2>QR Input</h2>

        <label class="field-label">Upload QR</label>
        <input type="file" id="qrUpload" accept="image/*" />
      </section>

      <section class="card">
        <h2>Mask</h2>

        <label class="field-label">Mask source</label>
        <select id="maskModeSelect">
          <option value="preset" selected>Preset</option>
          <option value="custom">Custom upload</option>
        </select>

        <div id="presetMaskSection">
          <label class="field-label">Preset shape</label>
          <select id="maskSelect"></select>
        </div>

        <div id="customMaskSection" class="hidden">
          <label class="field-label">Upload custom silhouette</label>
          <input type="file" id="customMaskUpload" accept="image/*" />

          <label class="field-label">Mask threshold</label>
          <input type="range" id="customMaskThreshold" min="0" max="255" value="180" />

          <label class="checkbox-row">
            <input type="checkbox" id="customMaskInvert" />
            <span>Invert mask</span>
          </label>

          <button id="buildMaskBtn" type="button">Build Custom Mask</button>
        </div>
      </section>

      <section class="card">
        <h2>Placement</h2>

        <label class="field-label">Center QR size</label>
        <select id="qrSizeSelect">
          <option value="xsmall">Extra Small</option>
          <option value="small">Small</option>
          <option value="medium" selected>Medium</option>
          <option value="large">Large</option>
        </select>

        <label class="field-label">Horizontal offset</label>
        <input type="range" id="qrOffsetX" min="-200" max="200" value="0" />
        <div class="readout" id="qrOffsetXLabel">0</div>

        <label class="field-label">Vertical offset</label>
        <input type="range" id="qrOffsetY" min="-200" max="200" value="0" />
        <div class="readout" id="qrOffsetYLabel">0</div>
      </section>

      <section class="card">
        <h2>Color</h2>

        <label class="field-label">Foreground</label>
        <input type="color" id="foregroundColor" value="#000000" />

        <label class="field-label">Background</label>
        <input type="color" id="backgroundColor" value="#ffffff" />

        <label class="checkbox-row">
          <input type="checkbox" id="transparentBackground" />
          <span>Transparent background</span>
        </label>
      </section>

      <section class="card button-stack">
        <button id="generateBtn" type="button">Generate</button>
        <button id="exportBtn" type="button">Export PNG</button>
      </section>
    </aside>

    <section class="previews">
      <div class="card preview-card">
        <h3>Original QR</h3>
        <canvas id="originalCanvas"></canvas>
      </div>

      <div class="card preview-card">
        <h3>Threshold QR</h3>
        <canvas id="thresholdCanvas"></canvas>
      </div>

      <div class="card preview-card">
        <h3>Inner Tile Source</h3>
        <canvas id="cropCanvas"></canvas>
      </div>

      <div class="card preview-card">
        <h3>Custom Mask Preview</h3>
        <canvas id="customMaskCanvas"></canvas>
      </div>

      <div class="card preview-card full-width">
        <h3>QR Camo Output</h3>
        <canvas id="outputCanvas"></canvas>
      </div>
    </section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
