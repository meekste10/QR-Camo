<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Camo Lab</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <h1>QR Camo Lab</h1>
    <p class="subtitle">Curves belong to the silhouette edge, not the decoding core.</p>
    <p id="debugPanel" style="background:#111;color:#00ff88;padding:8px 10px;font-size:12px;border:1px solid #333;">
      debug: html loaded
    </p>
  </header>

  <main class="app">

    <aside class="controls">

      <h2>Controls</h2>

      <label>Upload QR</label>
      <input type="file" id="qrUpload" accept="image/*">

      <label>Mask Shape</label>
      <select id="maskSelect">
        <option value="heart">heart</option>
        <option value="house">house</option>
        <option value="tag">tag</option>
        <option value="star">star</option>
        <option value="pizza">pizza</option>
        <option value="mug">mug</option>
        <option value="tree">tree</option>
        <option value="turtle">turtle</option>
      </select>

      <label>Crop %</label>
      <input type="range" id="cropSlider" min="0" max="40" value="22">

      <label>Tile Size</label>
      <input type="range" id="tileSlider" min="6" max="30" value="14">

      <label>
        <input type="checkbox" id="safeCoreToggle" checked>
        Safe Core
      </label>

      <button id="generateBtn">Generate</button>
      <button id="exportBtn">Export PNG</button>

    </aside>

    <section class="previews">

      <div class="preview">
        <h3>Original</h3>
        <canvas id="originalCanvas"></canvas>
      </div>

      <div class="preview">
        <h3>Threshold</h3>
        <canvas id="thresholdCanvas"></canvas>
      </div>

      <div class="preview">
        <h3>Cropped</h3>
        <canvas id="cropCanvas"></canvas>
      </div>

      <div class="preview">
        <h3>QR Camo Output</h3>
        <canvas id="outputCanvas"></canvas>
      </div>

    </section>

  </main>

  <script type="module" src="js/app.js"></script>

</body>
</html>
